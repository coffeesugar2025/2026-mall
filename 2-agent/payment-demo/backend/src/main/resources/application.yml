server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/payment_demo?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: AAAaaa1234
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# ============ 支付宝沙箱配置 ============
alipay:
  # 应用ID（沙箱应用ID）
  app-id: 9021000166674588
  # 商户私钥（沙箱提供）
  private-key: 
  # 支付宝公钥（沙箱提供）
  alipay-public-key: 
  # 支付宝网关（沙箱环境）
  gateway: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  # 签名类型
  sign-type: RSA2
  # 字符集
  charset: UTF-8
  # 格式
  format: JSON
  # 回调通知地址（公网可访问，沙箱可用 ngrok 等工具暴露）
  notify-url: http://your-domain.ngrok.io/api/alipay/notify
  # 前端回调地址
  return-url: http://localhost:5173/alipay/return?orderNo=
#  商家信息
#  商户账号cfgajx0350@sandbox.com
#  登录密码111111
#  商户PID2088721108264708
#  账户余额2000468.00
#  买家信息
#  买家账号xjvdoc6448@sandbox.com
