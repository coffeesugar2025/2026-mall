# ============ 微信支付 Mock 配置 ============
wechat:
  app-id: wx_mock_app_id
  mch-id: 1234567890
  api-v3-key: mock_api_v3_key_for_development
  # Mock 模式下不需要真实证书
  cert-path: classpath:mock-cert.pem
  # Mock 支付回调地址
  notify-url: http://your-domain.ngrok.io/api/wechat/notify

# 业务配置
payment:
  # 订单超时时间（分钟）
  order-timeout: 30
