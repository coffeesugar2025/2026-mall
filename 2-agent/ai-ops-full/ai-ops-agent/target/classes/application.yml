server:
  port: 8080

spring:
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s

langchain4j:
  open-ai:
    chat-model:
      api-key: ${OPENAI_API_KEY:demo}
      model-name: gpt-4o
      temperature: 0.2
      log-requests: true
      log-responses: true
    embedding-model:
      api-key: ${OPENAI_API_KEY:demo}
      model-name: text-embedding-3-small

aiops:
  rag:
    enabled: true
    # 生产环境切 Milvus/PGVector；本地演示用 InMemory
    store: in-memory
  memory:
    # 生产环境切 redis；本地演示用 in-memory
    store: in-memory
  agent:
    # supervisor = 多Agent协作; react = 单ReAct
    mode: supervisor
